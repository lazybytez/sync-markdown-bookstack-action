---
name: Check dist/

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check-dist:
        name: Check dist/
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run bundle
            - name: Compare the committed and rebuilt dist files
              id: diff
              run: |
                  changes=$(git status --porcelain -- dist/)
                  if [[ -n "${changes}" ]]; then
                      printf '%s\n' "${changes}"
                      git diff --text -- dist/
                      exit 1
                  fi
            - uses: actions/upload-artifact@v7
              if: ${{ failure() && steps.diff.conclusion == 'failure' }}
              with:
                  name: dist
                  path: dist/
