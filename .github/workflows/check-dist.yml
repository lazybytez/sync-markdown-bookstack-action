---
name: Check dist/

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check-dist:
        name: Check dist/
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Rebuild dist
              run: npm run bundle

            - name: Compare committed and rebuilt dist
              id: diff
              run: |
                  changes=$(git status --porcelain -- dist/)
                  if [[ -n "${changes}" ]]; then
                      printf '%s\n' "${changes}"
                      git diff --text -- dist/
                      exit 1
                  fi

            - name: Upload rebuilt dist
              if: ${{ failure() && steps.diff.conclusion == 'failure' }}
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/
