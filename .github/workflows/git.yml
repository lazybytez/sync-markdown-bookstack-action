---
name: Git

on:
    pull_request:

permissions:
    contents: read

jobs:
    verify_branch_name:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check branch name
              env:
                  BRANCH_NAME: ${{ github.head_ref }}
              run: |
                  case "${BRANCH_NAME}" in
                      feature/?*|fix/?*|hotfix/?*|release/?*|renovate/?*) ;;
                      *)
                          echo "Branch names must start with feature/, fix/, hotfix/, release/, or renovate/." >&2
                          exit 1
                          ;;
                  esac

    verify_commit_messages:
        if: github.actor != 'renovate[bot]' && !startsWith(github.head_ref, 'renovate/')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check commit messages
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: npm exec --no -- commitlint --from "${BASE_SHA}" --to "${HEAD_SHA}" --verbose
