version: "3"

vars:
    NODE_IMAGE: '{{.NODE_IMAGE | default "node:24"}}'
    HOST_USER:
        sh: printf '%s:%s' "$(id -u)" "$(id -g)"

tasks:
    run:
        internal: true
        desc: Run a command in the Node container
        cmds:
            - >-
                docker run --rm --user "{{.HOST_USER}}"
                --env npm_config_cache=/tmp/npm-cache
                --mount "type=bind,source={{.ROOT_DIR}},target=/workspace"
                --workdir /workspace "{{.NODE_IMAGE}}" {{.COMMAND}}
